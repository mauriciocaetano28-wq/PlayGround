<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GTA 6 BR — Modo Clássico</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,Arial,sans-serif;background:#07110d;color:#f6f1df}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 70% 20%,#b35d2e55,transparent 28%),linear-gradient(135deg,#081711,#10251b 55%,#07110d)}
    main{width:min(920px,calc(100% - 32px));border:1px solid #d6b98533;background:#09140fdd;box-shadow:0 24px 80px #0009;overflow:hidden}
    header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid #d6b98522}.brand{font-size:20px;font-weight:900}.brand small{display:block;color:#d8c795;font-size:10px;margin-top:3px;letter-spacing:2px}.status{color:#8fe49c;font-size:12px}
    .hero{display:grid;grid-template-columns:1.15fr .85fr;min-height:390px}.copy{padding:52px 48px}.kicker{color:#d6b985;font-size:11px;letter-spacing:3px}h1{font-size:72px;line-height:.85;margin:18px 0 22px;text-transform:uppercase}.copy p{max-width:500px;color:#cbd2c9;line-height:1.7}.badge{display:inline-flex;padding:8px 10px;border:1px solid #d6b98555;color:#d6b985;font-size:11px;margin-top:14px}.art{position:relative;background:linear-gradient(165deg,#de8b58,#463b35 55%,#0a1712);overflow:hidden}.art:before{content:"6";position:absolute;right:-8px;bottom:-80px;font-size:360px;font-weight:950;color:#f3cf75;line-height:1}.art:after{content:"BR";position:absolute;left:22px;bottom:28px;font-size:22px;font-weight:900;letter-spacing:12px;color:#fff}
    footer{display:flex;justify-content:flex-end;gap:10px;padding:18px 24px;border-top:1px solid #d6b98522}.btn{padding:13px 18px;border:1px solid #d6b98555;color:#eee;text-decoration:none;font-weight:800;font-size:12px}.btn.primary{background:#dfaa62;border-color:#dfaa62;color:#17140e}@media(max-width:700px){.hero{grid-template-columns:1fr}.art{display:none}.copy{padding:36px 24px}h1{font-size:54px}}
  </style>
</head>
<body>
  <main>
    <header><div class="brand">GTA 6 BR<small>MODO CLÁSSICO • MATTEO 5</small></div><div class="status">● PRESERVADO</div></header>
    <section class="hero">
      <div class="copy">
        <div class="kicker">BIBLIOTECA DE JOGOS</div>
        <h1>GTA 6<br>BR</h1>
        <p>O modo clássico continua disponível separadamente do GTA 7 BR. Seus controles, saves e conteúdos antigos permanecem preservados.</p>
        <div class="badge">CAMPAÑA ORIGINAL • LUISA/CARLOS INTERNOS</div>
      </div>
      <div class="art" aria-hidden="true"></div>
    </section>
    <footer>
      <a class="btn" href="./index.html">Voltar ao Matteo 5</a>
      <a class="btn primary" href="./index.html">▶ Jogar GTA 6 BR</a>
    </footer>
  </main>
</body>
</html>
