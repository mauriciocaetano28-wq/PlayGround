<!doctype html>
<html lang="pt-BR">
<head>

<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060907;font-family:Arial,Helvetica,sans-serif;color:white;touch-action:none}button{font:inherit;color:inherit}.screen{position:absolute;inset:0}.hidden{display:none!important}
#boot{display:grid;place-items:center;background:linear-gradient(135deg,#050705,#0a130a)}#boot .xbox{width:min(32vw,180px);height:min(32vw,180px);border:16px solid #5cff28;border-bottom-color:transparent;border-left-color:transparent;border-radius:50%;transform:rotate(-45deg);filter:drop-shadow(0 0 28px #55ff20)}#boot h1{position:absolute;top:64%;letter-spacing:8px;font-size:22px}#boot.fade{animation:fade 1s forwards}@keyframes fade{to{opacity:0}}

#game{background:#8dc9df}.hud{position:absolute;left:18px;top:18px;z-index:20;pointer-events:none}.money{font-size:20px;font-weight:800;text-shadow:2px 2px 2px #000}.wanted{color:#ffcf45;letter-spacing:3px}.missionhud{position:absolute;left:18px;top:80px;z-index:20;background:#111d;border-left:4px solid #ffbf25;padding:10px 12px;border-radius:4px;max-width:min(360px,65vw);pointer-events:none}#canvas{width:100%;height:100%;display:block}#subtitle{position:absolute;bottom:145px;left:50%;transform:translateX(-50%);z-index:30;text-align:center;background:#000b;padding:8px 14px;border-radius:5px;max-width:75%;font-weight:bold;pointer-events:none}.controls{position:absolute;z-index:40;left:0;right:0;bottom:12px;height:168px;pointer-events:none}.stick,.abxy,.menuButton,.xbtn{pointer-events:auto;position:absolute;user-select:none;touch-action:none}.stick{width:138px;height:138px;border-radius:50%;background:#1119;bottom:5px;left:20px;border:3px solid #ffffff66;box-shadow:inset 0 0 0 12px #ffffff0b}.stick:before{content:"";position:absolute;inset:20px;border:1px solid #ffffff22;border-radius:50%}.stick:after{content:"";position:absolute;width:58px;height:58px;border-radius:50%;left:37px;top:37px;background:radial-gradient(circle at 35% 30%,#879187,#252b26);border:2px solid #ffffff88;box-shadow:0 3px 8px #0009;transform:translate(var(--stick-x,0),var(--stick-y,0))}#ls{left:20px}.abxy{width:176px;height:154px;right:18px;bottom:2px}.abxy button{position:absolute;width:62px;height:62px;border-radius:50%;border:3px solid #ffffff88;font-weight:900;font-size:22px;box-shadow:0 3px 8px #0008;touch-action:none}.abxy button:active,.abxy button.pressed{filter:brightness(.72);transform:scale(.92)}#A{right:0;bottom:16px;background:#2fac42}#B{right:57px;top:0;background:#e33a43}#X{left:0;top:48px;background:#2490d5}#Y{right:57px;bottom:58px;background:#d9ad2d}.menuButton,.xbtn{width:44px;height:44px;border-radius:50%;background:#171d17;border:2px solid #ffffff88;bottom:118px;font-weight:bold}.view{left:calc(50% - 56px)}.menu{left:calc(50% + 12px)}.xbtn{left:calc(50% - 22px);bottom:10px;border-color:#86d85c;background:#1b301c;font-size:18px}#game button{cursor:pointer}
#cinematic{z-index:50;background:#111}.cinebar{position:absolute;left:0;right:0;height:13%;background:#050505}.cinebar.top{top:0}.cinebar.bottom{bottom:0}#cinematic canvas{width:100%;height:74%;top:13%;position:absolute}.cinecopy{position:absolute;z-index:55;bottom:16%;left:50%;transform:translateX(-50%);text-align:center}.cinecopy h2{margin:5px}.cinecopy button{border:0;border-radius:6px;background:#107c10;padding:10px 18px;font-weight:bold}
@media(max-width:700px){#topbar{padding:8px 12px}.content{padding:12px}.storehead h1{font-size:22px}.games{grid-template-columns:1fr 1fr 1fr;gap:7px}.game{height:56vh}.cover{height:64%}.gameinfo{padding:8px}.gametitle{font-size:13px}.meta{display:none}.download{padding:6px;font-size:11px}.person{transform:scale(.7);transform-origin:bottom}.controls{height:158px;bottom:max(8px,env(safe-area-inset-bottom))}.stick{width:128px;height:128px;left:12px;bottom:2px}.stick:after{width:54px;height:54px;left:34px;top:34px}.abxy{width:160px;height:145px;right:9px;bottom:0}.abxy button{width:58px;height:58px;font-size:20px}#A{right:0;bottom:14px}#B{right:52px;top:0}#X{left:0;top:44px}#Y{right:52px;bottom:53px}.menuButton{bottom:105px}.view{left:calc(50% - 52px)}.menu{left:calc(50% + 8px)}.xbtn{bottom:4px}#subtitle{bottom:140px;max-width:70%;font-size:14px}.missionhud{max-width:62vw;font-size:13px}}@media(max-height:500px){.controls{height:130px}.stick{width:104px;height:104px}.stick:after{width:44px;height:44px;left:27px;top:27px}.abxy{transform:scale(.8);transform-origin:bottom right}.missionhud{top:68px}.subtitle{bottom:112px}}
</style></head>
<body>
<div id="boot" class="screen"><div class="xbox"></div><h1>XBOX</h1></div>
<div id="dashboard" class="screen hidden"><header id="topbar"><div class="brand"><div class="brandball"></div>XBOX</div><div class="topactions"><button class="pill" id="lang">BR</button><button class="pill" id="settings">⚙</button></div></header><main class="content"><div class="storehead"><div><small>MICROSOFT STORE</small><h1>Jogos Grand City</h1></div><button class="pill" id="radio">♪ Rádio: CIDADE</button></div><section class="games" id="games"></section></main></div>
<div id="game" class="screen hidden"><canvas id="canvas"></canvas><div class="hud"><div class="money" id="money">$ 2.500</div><div class="wanted">★☆☆☆☆</div></div><div class="missionhud" id="missionhud">Visite o marcador dourado</div><div id="subtitle"></div><div class="controls"><button class="stick" id="ls" aria-label="Analógico: mova para andar"></button><button class="menuButton view" id="view" aria-label="Mapa">◧</button><button class="menuButton menu" id="menu" aria-label="Menu">☰</button><div class="abxy"><button id="A" aria-label="Ação">A</button><button id="B" aria-label="Voltar">B</button><button id="X" aria-label="Ação especial">X</button><button id="Y" aria-label="Missão">Y</button></div><button class="xbtn" id="xbox" aria-label="Voltar à loja">X</button></div></div>
<div id="cinematic" class="screen hidden"><div class="cinebar top"></div><canvas id="cinecanvas"></canvas><div class="cinebar bottom"></div><div class="cinecopy"><h2 id="cinetitle"></h2><button id="skipcine">INICIAR MISSÃO</button></div></div>
<script>
const $=s=>document.querySelector(s), gamesEl=$('#games');let lang='BR',installed=JSON.parse(localStorage.getItem('gcity-installed')||'[]'),downloading=false;const titles=[['GTA 6','Los Santos 209 GB','cover6'],['GTA 5','Los Santos 95 GB','cover5'],['GTA 5 BR','Brasil City 88 GB','coverbr']];
function renderStore(){gamesEl.innerHTML='';titles.forEach((g,i)=>{const is=installed.includes(i),el=document.createElement('article');el.className='game'+(is?' selected':'');el.innerHTML=`<div class="cover ${g[2]}"><div class="artcity"></div><div class="sun"></div><div class="person"></div></div><div class="gameinfo"><button class="download" data-i="${i}">${is?'JOGAR':'BAIXAR'}</button><div class="gametitle">${g[0]}</div><div class="meta">${g[1]} • Ação</div><div class="progress"><i></i></div></div>`;gamesEl.appendChild(el)})}renderStore();
setTimeout(()=>{$('#boot').classList.add('fade');setTimeout(()=>{$('#boot').classList.add('hidden');$('#dashboard').classList.remove('hidden')},900)},1500);
$('#lang').onclick=()=>{lang=lang==='BR'?'EN':'BR';$('#lang').textContent=lang;speak(lang==='BR'?'Idioma português selecionado':'English language selected')};
$('#settings').onclick=()=>speak(lang==='BR'?'Configurações: áudio e idioma':'Settings: audio and language');
function speak(text){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang==='BR'?'pt-BR':'en-US';u.rate=.9;speechSynthesis.speak(u)}
function engineBeep(freq=.08,dur=.08){try{const A=new (AudioContext||webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.type='sawtooth';o.frequency.value=55+freq*300;g.gain.setValueAtTime(.025,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+dur);o.connect(g).connect(A.destination);o.start();o.stop(A.currentTime+dur)}catch(e){}}
gamesEl.onclick=e=>{
 const b=e.target.closest('.download');
 if(!b)return;
 const i=+b.dataset.i;
 if(installed.includes(i)){startGame(i);return}
 if(downloading)return;
 downloading=true;
 let p=0;
 const bar=b.parentElement.querySelector('.progress i');
 b.textContent='BAIXANDO';
 const t=setInterval(()=>{
  p+=4+Math.random()*8;
  if(p>=100){
   clearInterval(t);p=100;
   installed.push(i);
   localStorage.setItem('gcity-installed',JSON.stringify(installed));
   b.textContent='JOGAR';bar.style.width='100%';downloading=false;renderStore();
  }else{bar.style.width=p+'%'}
 },160);
};
const cv=$('#canvas'),ctx=cv.getContext('2d');let W=0,H=0,dpr=1,px=500,py=500,keys={},mission=false,missionStage=0,vehicle=false,cash=2500,currentGame=0,deliveryMode=false,joy={x:0,y:0},car={x:650,y:520},npcs=[{x:300,y:400,s:'npc'}, {x:760,y:300,s:'cop'}, {x:680,y:710,s:'npc'}];
function resize(){dpr=Math.max(1,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;if(!W||!H)return;const w=Math.round(W*dpr),h=Math.round(H*dpr);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}}
window.addEventListener('resize',resize);resize();
function startGame(i){currentGame=i;$('#dashboard').classList.add('hidden');$('#game').classList.remove('hidden');mission=false;missionStage=0;deliveryMode=false;vehicle=false;cash=2500;px=500;py=500;car={x:650,y:520};$('#money').textContent='$ 2,500';$('#missionhud').textContent=lang==='BR'?'Vá até o marcador dourado':'Go to the golden marker';resize();speak(lang==='BR'?'Bem-vindo a Grand City. Use o analógico para andar; A para entrar no carro.':'Welcome to Grand City. Use the stick to move; press A near the car.')}
function draw(){if($('#game').classList.contains('hidden')){requestAnimationFrame(draw);return}resize();if(!W||!H){requestAnimationFrame(draw);return}let dx=joy.x+(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),dy=joy.y+(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0),len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len}const speed=vehicle?4.8:2.6;px=Math.max(140,Math.min(900,px+dx*speed));py=Math.max(140,Math.min(900,py+dy*speed));if(vehicle){car.x=px;car.y=py}
ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#65a77a';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2-px*.9,H/2-py*.45);ctx.scale(.9,.45);
ctx.fillStyle='#30383a';ctx.fillRect(120,120,800,800);ctx.fillStyle='#b9a87d';ctx.fillRect(450,120,160,800);ctx.fillRect(120,450,800,160);ctx.strokeStyle='#e7dbad';ctx.lineWidth=4;ctx.setLineDash([28,22]);ctx.beginPath();ctx.moveTo(530,120);ctx.lineTo(530,920);ctx.moveTo(120,530);ctx.lineTo(920,530);ctx.stroke();ctx.setLineDash([]);
for(let x=180;x<440;x+=120)for(let y=180;y<420;y+=120){ctx.fillStyle='#d8bf8f';ctx.fillRect(x,y,90,90);ctx.fillStyle='#4f7185';ctx.fillRect(x+12,y+12,22,18);ctx.fillRect(x+52,y+12,22,18)}for(let x=650;x<900;x+=100)for(let y=620;y<860;y+=100){ctx.fillStyle='#9caab0';ctx.fillRect(x,y,70,70)}
if(!vehicle){ctx.save();ctx.translate(car.x,car.y);ctx.fillStyle='#d53b36';ctx.fillRect(-28,-20,56,40);ctx.fillStyle='#92c6d6';ctx.fillRect(-15,-15,30,30);ctx.fillStyle='#171717';ctx.fillRect(-23,-24,13,7);ctx.fillRect(10,-24,13,7);ctx.fillRect(-23,17,13,7);ctx.fillRect(10,17,13,7);ctx.restore()}
const target=deliveryMode?{x:820,y:820,color:'#5cffb1'}:{x:530,y:350,color:'#ffd54a'},pulse=18+Math.sin(Date.now()/180)*5;ctx.fillStyle=deliveryMode?'rgba(82,255,177,.35)':'rgba(255,202,45,.5)';ctx.beginPath();ctx.arc(target.x,target.y,pulse,0,7);ctx.fill();ctx.fillStyle=target.color;ctx.beginPath();ctx.moveTo(target.x,target.y-30);ctx.lineTo(target.x+20,target.y);ctx.lineTo(target.x-20,target.y);ctx.closePath();ctx.fill();
npcs.forEach((n,i)=>{ctx.fillStyle=i===1?'#1e65ad':'#d4a14d';ctx.fillRect(n.x-10,n.y-28,20,28);ctx.fillStyle='#9c6545';ctx.beginPath();ctx.arc(n.x,n.y-34,9,0,7);ctx.fill()});ctx.fillStyle=vehicle?'#202020':'#141817';ctx.fillRect(px-14,py-30,28,30);if(!vehicle){ctx.fillStyle='#a86f50';ctx.beginPath();ctx.arc(px,py-38,10,0,7);ctx.fill()}ctx.restore();
if(!mission&&Math.hypot(px-530,py-350)<52){mission=true;missionStage=1;cinematic()}if(deliveryMode&&Math.hypot(px-820,py-820)<48){deliveryMode=false;mission=false;missionStage=0;cash+=1500;$('#money').textContent='$ '+cash.toLocaleString();$('#missionhud').textContent=lang==='BR'?'MISSÃO CONCLUÍDA • +$1.500':'MISSION COMPLETE • +$1,500';engineBeep(.5,.4);speak(lang==='BR'?'Missão concluída. Você ganhou mil e quinhentos dólares.':'Mission complete. You earned one thousand five hundred dollars.')}requestAnimationFrame(draw)}requestAnimationFrame(draw);
function cinematic(){const c=$('#cinematic');c.classList.remove('hidden');const cc=$('#cinecanvas'),x=cc.getContext('2d');cc.width=cc.clientWidth*devicePixelRatio;cc.height=cc.clientHeight*devicePixelRatio;let t=0;const title=lang==='BR'?'ENTREGA DUVIDOSA':'DOUBTFUL DELIVERY';$('#cinetitle').textContent=title;const text=lang==='BR'?'Marco: Preciso que leve este pacote para o outro lado da cidade.':'Marco: Take this package across town.';$('#subtitle').textContent=text;speak(text);function cf(){if(c.classList.contains('hidden'))return;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);let w=cc.clientWidth,h=cc.clientHeight;t++;let grad=x.createLinearGradient(0,0,w,h);grad.addColorStop(0,'#d29a66');grad.addColorStop(1,'#31526a');x.fillStyle=grad;x.fillRect(0,0,w,h);x.fillStyle='#20282b';for(let i=0;i<9;i++)x.fillRect(i*w/9,h*.45,w/11,h*.55);x.fillStyle='#6a3d29';x.beginPath();x.arc(w*.38,h*.62,28+Math.sin(t/20)*2,0,7);x.fill();x.fillStyle='#c29a73';x.beginPath();x.arc(w*.62,h*.58,28+Math.sin(t/20)*2,0,7);x.fill();x.strokeStyle='#e9c198';x.lineWidth=8;x.beginPath();x.moveTo(w*.38,h*.72);x.lineTo(w*.38+t%20,h*.58);x.moveTo(w*.62,h*.68);x.lineTo(w*.62-t%20,h*.54);x.stroke();requestAnimationFrame(cf)}cf()}
$('#skipcine').onclick=()=>{$('#cinematic').classList.add('hidden');$('#subtitle').textContent='';$('#missionhud').textContent=lang==='BR'?'Missão: leve o pacote ao porto':'Mission: deliver the package to the docks';px=530;py=360;deliveryMode=true};
function openMenu(){const txt=lang==='BR'?'Menu: Mapa • Rádio • Idioma BR':'Menu: Map • Radio • Language EN';$('#subtitle').textContent=txt;speak(txt);setTimeout(()=>{if(!$('#cinematic').classList.contains('hidden')){}else $('#subtitle').textContent=''},2200)}
let radioIndex=0;
const radioNames=lang==='BR'?['CIDADE','FUNK','PAGODE','SERTANEJO']:['CITY','HIP-HOP','ROCK','POP'];
function playRadio(){radioIndex=(radioIndex+1)%radioNames.length;$('#radio').textContent='♪ Rádio: '+radioNames[radioIndex];speak(lang==='BR'?`Rádio ${radioNames[radioIndex]} ligado`:`Radio ${radioNames[radioIndex]} on`) }
$('#radio').onclick=playRadio;
$('#menu').onclick=openMenu;$('#view').onclick=()=>{speak(lang==='BR'?'Mapa da cidade aberto':'City map open')};$('#xbox').onclick=()=>{$('#game').classList.add('hidden');$('#dashboard').classList.remove('hidden')};
function actionA(){if(vehicle){vehicle=false;$('#missionhud').textContent=lang==='BR'?'A pé • use o analógico para andar':'On foot • use the stick to move';speak(lang==='BR'?'Você saiu do carro':'You got out of the car');return}if(Math.hypot(px-car.x,py-car.y)<72){vehicle=true;$('#missionhud').textContent=lang==='BR'?'Dirija até o destino • A para sair':'Drive to the destination • A to exit';speak(lang==='BR'?'Você entrou no carro':'You got in the car')}else speak(lang==='BR'?'Chegue perto do carro para entrar':'Get close to the car to enter')}
function actionX(){engineBeep(.35,.18);speak(lang==='BR'?'Buzina':'Car horn')}
function actionY(){const target=deliveryMode?'porto':'marcador dourado';$('#missionhud').textContent=lang==='BR'?'Destino: '+target:'Objective: '+(deliveryMode?'the docks':'gold marker');engineBeep(.6,.12)}
function bindPress(id,action){const b=$('#'+id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('pressed');action()});['pointerup','pointercancel','lostpointercapture'].forEach(type=>b.addEventListener(type,()=>b.classList.remove('pressed')))}
bindPress('A',actionA);bindPress('B',()=>{if(vehicle)actionA();else openMenu()});bindPress('X',actionX);bindPress('Y',actionY);
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys[k]=true;if(k==='escape')openMenu();if(k==='e')actionA();if(k===' ')actionX();if(k==='q')actionY()});window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
const ls=$('#ls');let joyPointer=null;
function moveStick(e){const r=ls.getBoundingClientRect(),radius=Math.max(24,(r.width-58)/2),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),dist=Math.hypot(x,y),scale=dist>radius?radius/dist:1,nx=x*scale,ny=y*scale;joy={x:nx/radius,y:ny/radius};ls.style.setProperty('--stick-x',nx+'px');ls.style.setProperty('--stick-y',ny+'px')}
function releaseStick(e){if(joyPointer!==e.pointerId)return;joyPointer=null;joy={x:0,y:0};ls.style.setProperty('--stick-x','0px');ls.style.setProperty('--stick-y','0px')}
ls.addEventListener('pointerdown',e=>{e.preventDefault();joyPointer=e.pointerId;ls.setPointerCapture(e.pointerId);moveStick(e)});ls.addEventListener('pointermove',e=>{if(joyPointer===e.pointerId)moveStick(e)});['pointerup','pointercancel','lostpointercapture'].forEach(type=>ls.addEventListener(type,releaseStick));
</script>
</body></html>
