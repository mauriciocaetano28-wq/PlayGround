<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Fortnite BR 2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Trebuchet MS,Arial;background:#79cfff;touch-action:none}canvas{display:block;width:100%;height:100%}
#ui{position:absolute;inset:0;pointer-events:none;color:white;text-shadow:2px 2px 0 #24314e}.panel{pointer-events:auto}
.topbar{position:absolute;top:18px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:flex-start}.players{background:#0c1d36cc;border:2px solid #fff;border-radius:12px;padding:8px 13px;font-weight:900}.alive{font-size:20px}.storm{margin-top:4px;font-size:13px;color:#ffe36b}.health{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);width:min(420px,45vw);text-align:center}.bar{height:22px;border:3px solid #19233a;border-radius:7px;background:#4d2362;overflow:hidden}.hp{height:100%;width:100%;background:linear-gradient(90deg,#75e22c,#baff63);transition:.2s}.shields{position:absolute;right:-2px;top:-27px;font-size:13px;color:#66c6ff;font-weight:bold}.inventory{position:absolute;bottom:18px;right:22px;display:flex;gap:7px}.slot{width:58px;height:58px;border:3px solid #dcecff;border-radius:10px;background:#19233a99;display:grid;place-content:center;text-align:center;font-size:10px;font-weight:bold}.slot.active{border-color:#ffe968;transform:translateY(-8px);background:#7651aacc}.slot b{display:block;font-size:20px}
.actions{position:absolute;right:20px;bottom:92px;width:180px;height:190px;pointer-events:auto}.btn{position:absolute;width:68px;height:68px;border:3px solid #fff;border-radius:50%;background:#18243db8;color:white;font-weight:900;font-size:11px;text-shadow:1px 1px #111;display:grid;place-content:center;text-align:center;box-shadow:0 4px 12px #0004}.btn:active,.btn.down{transform:scale(.92);background:#6044cdbd}.shoot{right:0;bottom:0;width:82px;height:82px;border-radius:50%;background:#d8355bbd}.jump{right:88px;bottom:0}.build{right:0;bottom:96px}.dance{right:88px;bottom:94px}.edit{left:0;bottom:50px}.loot{left:0;bottom:128px}
.joy{position:absolute;left:22px;bottom:92px;width:145px;height:145px;border:3px solid #ffffff66;border-radius:50%;background:#ffffff1c;pointer-events:auto}.stick{position:absolute;width:70px;height:70px;left:37px;top:37px;border-radius:50%;background:#ffffff55;border:2px solid #fff}
.hotbar{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);display:flex;gap:6px}.res{background:#17243bb8;border:2px solid #fff8;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:bold}.res.wood{color:#ffd58a}.res.stone{color:#ddd}.res.metal{color:#98dcff}
.modal{position:absolute;inset:0;background:#061329d9;display:grid;place-content:center;z-index:20;pointer-events:auto;text-align:center}.modal.hidden{display:none}.menu{width:min(850px,92vw);max-height:92vh;overflow:auto}.logo{font-size:clamp(48px,8vw,94px);line-height:.8;font-weight:1000;color:#fff;transform:rotate(-3deg);text-shadow:5px 5px 0 #7b4ad9,-5px -2px 0 #31c8ef,0 10px 0 #1b3c75;letter-spacing:-5px}.sublogo{font-size:20px;color:#ffe554;margin:16px 0 22px;font-weight:bold}.modegrid{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.mode{width:230px;height:128px;border:3px solid #fff;border-radius:16px;background:linear-gradient(135deg,#5549b7,#26b8df);color:white;font-weight:900;font-size:19px;cursor:pointer;box-shadow:0 8px 0 #24356d}.mode:hover{filter:brightness(1.12);transform:translateY(-3px)}.mode small{display:block;margin-top:8px;font-size:11px;color:#d8efff}.settings{margin-top:14px}.settings button{border:2px solid #fff;border-radius:9px;background:#26395f;color:#fff;padding:9px 12px;margin:3px;font-weight:bold}.settings button.on{background:#6d52cb}.controls{max-width:680px;margin:12px auto 0;text-align:left;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.control{text-align:left;background:#162a4d;border:1px solid #ffffff55;border-radius:8px;padding:8px;font-size:12px}.toast{position:absolute;left:50%;top:18%;transform:translateX(-50%) scale(.8);background:#263f75;border:3px solid white;border-radius:12px;padding:12px 20px;font-size:19px;font-weight:bold;opacity:0;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%) scale(1)}.victory{position:absolute;inset:0;display:none;place-content:center;text-align:center;z-index:18;background:#5e4de0aa}.victory.show{display:grid}.victory h1{font-size:clamp(48px,10vw,100px);margin:0;color:#ffe44a;text-shadow:5px 5px 0 #e45262,0 8px 30px #fff}.mapmodal{width:min(700px,85vw);height:min(650px,75vh);border:5px solid white;border-radius:18px;background:linear-gradient(135deg,#62c76b,#51b8e9);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;pointer-events:auto}.mapmodal.show{display:block}.crosshair{position:absolute;left:50%;top:50%;width:18px;height:18px;border:2px solid white;border-radius:50%;opacity:.75}.crosshair:after{content:'';position:absolute;width:4px;height:4px;background:white;border-radius:50%;left:5px;top:5px}
@media(max-width:700px){.slot{width:48px;height:48px}.inventory{right:8px}.hotbar{display:none}.health{bottom:10px;width:40vw}.actions{right:8px}.joy{left:8px}.topbar{top:8px}.controls{grid-template-columns:1fr}}
</style></head><body>
<canvas id="game"></canvas><div id="ui"><div class="topbar"><div class="players"><div class="alive"><span id="alive">100</span> JOGADORES</div><div class="storm" id="storm">TEMPO NA ÁREA SEGURA: 1:30</div></div><div class="players" id="modeLabel">BATTLE ROYALE</div></div>
<div class="crosshair"></div><div class="health"><div class="shields">ESCUDO 50</div><div class="bar"><div class="hp" id="hp"></div></div></div>
<div class="hotbar"><div class="res wood">▰ Madeira <b id="wood">120</b></div><div class="res stone">◆ Pedra <b id="stone">45</b></div><div class="res metal">⬢ Ferro <b id="metal">20</b></div></div>
<div class="inventory"><div class="slot active"><b>1</b>DANÇAR</div><div class="slot"><b>⌁</b>PICARETA</div><div class="slot"><b>▰</b>PAREDE</div><div class="slot"><b>▱</b>ESCADA</div></div>
<div class="joy" id="joy"><div class="stick" id="stick"></div></div>
<div class="actions"><button class="btn loot" id="lootBtn">PEGAR<br>BAÚ</button><button class="btn edit" id="editBtn">EDITAR</button><button class="btn dance" id="danceBtn">DANÇAR</button><button class="btn build" id="buildBtn">PAREDE</button><button class="btn jump" id="jumpBtn">PULAR</button><button class="btn shoot" id="shootBtn">ATIRAR</button></div>
<div class="toast" id="toast"></div><div class="mapmodal" id="mapmodal"></div>
<div class="modal" id="menu"><div class="menu"><div class="logo">FORTNITE<br>BR 2</div><div class="sublogo">CONSTRUÇÃO DA ILHA • BATTLE ROYALE</div><div class="modegrid"><button class="mode" data-mode="BR">BATTLE ROYALE<br><small>100 JOGADORES • ÚLTIMO VIVO</small></button><button class="mode" data-mode="CRIATIVO">MODO CRIATIVO<br><small>CONSTRUA SUA PRÓPRIA ILHA</small></button><button class="mode" data-mode="FESTA">MODO FESTA<br><small>DANCE SEM LIMITES</small></button></div><div class="settings panel"><div style="font-weight:bold;margin-bottom:5px">CONFIGURAÇÕES › CONTROLES</div><button class="ctrl on" data-ctrl="CELULAR">CELULAR</button><button class="ctrl" data-ctrl="XBOX">XBOX</button><button class="ctrl" data-ctrl="PLAYSTATION">PLAYSTATION</button><button class="ctrl" data-ctrl="COMPUTADOR">COMPUTADOR</button></div><div class="controls panel" id="controlHelp"></div></div></div>
<div class="victory" id="victory"><div><h1>VICTORY<br>ROYALE!</h1><div style="font-size:30px;color:white;font-weight:bold">DANÇANDO NA ILHA • 1º LUGAR</div></div></div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,DPR=1;function resize(){DPR=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
let playing=false,mode='BR',game={x:0,y:0,a:0,wood:120,stone:45,metal:20,hp:100,alive:100,kill:false,kills:0,dance:0,jump:0};
const keys={};let mouseX=0,mouseY=0,builds=[],enemies=[],loot=[],shots=[];
function rand(n){return Math.random()*n-n/2}for(let i=0;i<70;i++)enemies.push({x:rand(900),y:rand(900),c:['#ff6ba1','#4ec7ff','#ffd75a','#66df9d'][i%4],dir:Math.random()*6.28});
loot=[{x:170,y:-140,o:true},{x:-280,y:220,o:true},{x:420,y:310,o:true}];
function world(p){let sx=W/2+(p.x-game.x)*.75,sy=H/2+(p.y-game.y)*.75;return [sx,sy]}
function drawIsland(){let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#66c8ff');grad.addColorStop(1,'#a7e5ff');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
// lake
ctx.fillStyle='#4ac0df';ctx.beginPath();ctx.ellipse(W*.72,H*.42,150,90, -.2,0,7);ctx.fill();ctx.strokeStyle='#eaf8ff';ctx.lineWidth=5;ctx.stroke();
// ground grid and landmarks
ctx.save();ctx.translate(W/2-game.x*.75,H/2-game.y*.75);ctx.rotate(.02);ctx.fillStyle='#64c66a';ctx.fillRect(-700,-620,1400,1240);ctx.strokeStyle='#83dc84';ctx.lineWidth=1;for(let x=-700;x<700;x+=50){ctx.beginPath();ctx.moveTo(x,-620);ctx.lineTo(x,620);ctx.stroke()}for(let y=-620;y<620;y+=50){ctx.beginPath();ctx.moveTo(-700,y);ctx.lineTo(700,y);ctx.stroke()}ctx.restore();
// far map landmarks placed world style
function building(x,y,w,h,c){let p=world({x,y});ctx.fillStyle=c||'#f6c55d';ctx.fillRect(p[0]-w/2,p[1]-h/2,w,h);ctx.fillStyle='#864f74';ctx.fillRect(p[0]-w*.32,p[1]-h*.2,w*.64,h*.55);ctx.fillStyle='#fff';ctx.fillRect(p[0]-w*.24,p[1]-h*.43,w*.48,h*.12)}
building(-380,-180,150,90,'#f58ba1');building(-260,-260,110,80,'#f7d55e');building(290,-220,180,120,'#7772d8');building(420,150,130,100,'#f4b95e');
// mountain
let m=world({x:250,y:-430});ctx.fillStyle='#69ae72';ctx.beginPath();ctx.moveTo(m[0]-170,m[1]+80);ctx.lineTo(m[0],m[1]-150);ctx.lineTo(m[0]+170,m[1]+80);ctx.fill();ctx.fillStyle='#eef5ef';ctx.beginPath();ctx.moveTo(m[0]-55,m[1]-50);ctx.lineTo(m[0],m[1]-150);ctx.lineTo(m[0]+58,m[1]-48);ctx.fill();
// castle
let c=world({x:-450,y:280});ctx.fillStyle='#bc91df';ctx.fillRect(c[0]-80,c[1]-50,160,100);ctx.fillStyle='#8e63bd';ctx.fillRect(c[0]-95,c[1]-75,34,125);ctx.fillRect(c[0]+61,c[1]-75,34,125);ctx.fillStyle='#553b82';ctx.fillRect(c[0]-18,c[1]-25,36,75);
// trees
for(let i=0;i<28;i++){let x=-650+(i*137)%1300,y=-550+(i*79)%1050,p=world({x,y});ctx.fillStyle='#8b5b35';ctx.fillRect(p[0]-5,p[1],10,20);ctx.fillStyle=i%3?'#1c9a55':'#38b75c';ctx.beginPath();ctx.arc(p[0],p[1]-12,22,0,7);ctx.fill()}
// loot chests
loot.forEach(l=>{if(!l.o)return;let p=world(l);ctx.fillStyle='#ffb92f';ctx.fillRect(p[0]-18,p[1]-12,36,24);ctx.fillStyle='#7c3ba0';ctx.fillRect(p[0]-15,p[1]-10,30,8);ctx.fillStyle='#fff19a';ctx.fillRect(p[0]-3,p[1]-1,6,8)});
// structures
builds.forEach(b=>{let p=world(b);ctx.fillStyle='#d6a35a';ctx.fillRect(p[0]-35,p[1]-55,70,110);ctx.fillStyle='#f4ca76';ctx.fillRect(p[0]-30,p[1]-50,60,100);ctx.strokeStyle='#9d6b37';ctx.lineWidth=3;for(let y=-45;y<50;y+=20){ctx.beginPath();ctx.moveTo(p[0]-30,p[1]+y);ctx.lineTo(p[0]+30,p[1]+y);ctx.stroke()}});
// enemies
enemies.forEach((e,i)=>{if(e.dead)return;let p=world(e);if(p[0]<-30||p[0]>W+30||p[1]<-30||p[1]>H+30)return;e.x+=Math.sin(e.dir)*.25;e.y+=Math.cos(e.dir)*.25;e.dir+=rand(.01);ctx.fillStyle=e.c;ctx.beginPath();ctx.arc(p[0],p[1]-18,13,0,7);ctx.fill();ctx.fillStyle='#7b4bd2';ctx.fillRect(p[0]-10,p[1]-5,20,28);ctx.fillStyle='#ffd0a3';ctx.beginPath();ctx.arc(p[0],p[1]-23,8,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.fillText('JOGADOR '+(i+1),p[0],p[1]-42)});
// player
ctx.save();ctx.translate(W/2,H/2);if(game.dance>0){game.dance--;ctx.rotate(Math.sin(Date.now()/100)*.18)}if(game.jump>0){game.jump--;ctx.translate(0,-Math.sin(game.jump/14*Math.PI)*25)}ctx.fillStyle='#f3b44b';ctx.fillRect(-12,-4,24,38);ctx.fillStyle='#ff6fc3';ctx.beginPath();ctx.moveTo(-18,28);ctx.lineTo(-9,-5);ctx.lineTo(9,-5);ctx.lineTo(18,28);ctx.fill();ctx.fillStyle='#ffd19a';ctx.beginPath();ctx.arc(0,-22,14,0,7);ctx.fill();ctx.fillStyle='#5633a6';ctx.beginPath();ctx.arc(0,-25,15,Math.PI,6.8);ctx.fill();ctx.fillStyle='#4ab7f0';ctx.fillRect(-22,-10,44,7);ctx.restore();
shots.forEach((s,i)=>{s.life--;let p=world(s);ctx.fillStyle='#fff07a';ctx.beginPath();ctx.arc(p[0],p[1],4,0,7);ctx.fill();if(s.life<0)shots.splice(i,1)});
}
function draw(){drawIsland();if(playing)requestAnimationFrame(draw)}
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2200)}
function shoot(){if(!playing)return;if(mode==='FESTA')return dance();shots.push({x:game.x,y:game.y,life:40});let hit=null,best=999;enemies.forEach(e=>{if(e.dead)return;let d=Math.hypot(e.x-game.x,e.y-game.y);if(d<best&&d<240){best=d;hit=e}});if(hit){hit.dead=true;game.kills++;game.alive--;toast('ELIMINADO! + DANÇA');game.dance=90;setTimeout(()=>{if(game.alive<=1)win()},500)} }
function win(){playing=false;document.getElementById('victory').classList.add('show');}
function dance(){game.dance=180;toast('DANÇA BR EM FRENTE!')}
function buildWall(){if(!playing)return;if(game.wood<10)return toast('Madeira insuficiente');game.wood-=10;builds.push({x:game.x+Math.sin(game.a)*90,y:game.y+Math.cos(game.a)*90});document.getElementById('wood').textContent=game.wood;toast('PAREDE CONSTRUÍDA')}
function pickup(){let found=false;loot.forEach(l=>{if(l.o&&Math.hypot(l.x-game.x,l.y-game.y)<130){l.o=false;found=true;game.wood+=25;game.stone+=10;document.getElementById('wood').textContent=game.wood;document.getElementById('stone').textContent=game.stone}});toast(found?'BAÚ: Madeira +25 • Pedra +10':'Sem baú por perto')}
function edit(){toast(builds.length?'PAREDE EDITADA: JANELA ABERTA':'Construa uma parede primeiro')}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')game.jump=28;if(e.key==='Escape')return menu();if(e.key.toLowerCase()==='e')pickup();if(e.key.toLowerCase()==='q')buildWall();if(e.key.toLowerCase()==='f')edit();if(e.key.toLowerCase()==='1')dance();if(e.key.toLowerCase()==='c')buildWall();if(e.key.toLowerCase()==='z')buildWall();if(e.key.toLowerCase()==='m')toggleMap()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('mousemove',e=>{mouseX=e.clientX-W/2;mouseY=e.clientY-H/2;if(Math.abs(mouseX)+Math.abs(mouseY)>10)game.a=Math.atan2(mouseX,-mouseY)});addEventListener('mousedown',e=>{if(e.button===0)shoot();if(e.button===2){} });addEventListener('contextmenu',e=>e.preventDefault());
function loop(){if(!playing)return;let sp=3;if(keys.w||keys.arrowup)game.y-=sp;if(keys.s||keys.arrowdown)game.y+=sp;if(keys.a||keys.arrowleft)game.x-=sp;if(keys.d||keys.arrowright)game.x+=sp;requestAnimationFrame(loop)}
function start(){document.getElementById('menu').classList.add('hidden');document.getElementById('victory').classList.remove('show');playing=true;game.alive=100;loop();draw();toast(mode==='CRIATIVO'?'MODO CRIATIVO ATIVO':mode==='FESTA'?'MODO FESTA ATIVO':'CAINDO NA ILHA...')}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.getElementById('modeLabel').textContent=mode==='BR'?'BATTLE ROYALE':mode==='CRIATIVO'?'MODO CRIATIVO':'MODO FESTA';start()});
function menu(){playing=false;document.getElementById('menu').classList.remove('hidden')}
const controls={CELULAR:'TOQUE: joystick andar • ATIRAR • PAREDE • ESCADA • DANÇAR • EDITAR • BAÚ',XBOX:'Xbox: LT mira • RT atira • A pular • B editar • X baú • Y dançar • LB parede • RB escada',PLAYSTATION:'PS: L2 mira • R2 atira • X pular • Bola editar • Quadrado baú • Triângulo dança • L1 parede • R1 escada',COMPUTADOR:'PC: WASD andar • Mouse mirar • Clique atirar • Espaço pular • E baú • F editar • Q parede • Z escada • C chão • 1 dança • M mapa'};
function setControls(type){document.querySelectorAll('.ctrl').forEach(b=>b.classList.toggle('on',b.dataset.ctrl===type));document.getElementById('controlHelp').innerHTML='<div class="control">'+controls[type].replaceAll(' • ','</div><div class="control">')+'</div>'}setControls('CELULAR');document.querySelectorAll('.ctrl').forEach(b=>b.onclick=()=>setControls(b.dataset.ctrl));
window.addEventListener('gamepadconnected',e=>{let id=(e.gamepad.id||'').toLowerCase();let ps=/dualsense|dualshock|sony|playstation/.test(id);toast(ps?'CONTROLE PLAYSTATION CONECTADO!':'CONTROLE XBOX CONECTADO!');setControls(ps?'PLAYSTATION':'XBOX')});
function gamepadLoop(){let gp=navigator.getGamepads&&navigator.getGamepads().find(g=>g);if(gp&&playing){let dead=.15;if(Math.abs(gp.axes[0])>dead)game.x+=gp.axes[0]*3;if(Math.abs(gp.axes[1])>dead)game.y+=gp.axes[1]*3;if(gp.buttons[7]?.pressed){ }if(gp.buttons[5]?.pressed)buildWall();if(gp.buttons[0]?.pressed)game.jump=28;if(gp.buttons[1]?.pressed)edit();if(gp.buttons[2]?.pressed)pickup();if(gp.buttons[3]?.pressed)dance();if(gp.buttons[7]?.pressed||gp.buttons[0]?.pressed)shoot()}requestAnimationFrame(gamepadLoop)}gamepadLoop();
let joy=document.getElementById('joy'),stick=document.getElementById('stick'),joyId=null;joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId)});joy.addEventListener('pointermove',e=>{if(e.pointerId!==joyId)return;let r=joy.getBoundingRect?.()||joy.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),d=Math.hypot(x,y),m=Math.min(d,48);x=x/d*m||0;y=y/d*m||0;stick.style.transform=`translate(${x}px,${y}px)`;game.x+=x*.07;game.y+=y*.07});joy.addEventListener('pointerup',()=>{joyId=null;stick.style.transform=''});
document.queryBinding = null;
['lootBtn','editBtn','danceBtn','buildBtn','jumpBtn','shootBtn'].forEach(id=>{let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventTarget?.();el.classList.add('down')});el.addEventListener('pointerup',()=>el.classList.remove('down'))});
document.getElementById('lootBtn').onclick=pickup;document.getElementById('editBtn').onclick=edit;document.getElementById('danceBtn').onclick=dance;document.getElementById('buildBtn').onclick=buildWall;document.getElementById('jumpBtn').onclick=()=>game.jump=28;document.getElementById('shootBtn').onclick=shoot;
function toggleMap(){let m=document.getElementById('mapmodal');m.classList.toggle('show');if(m.classList.contains('show')){ctx=null}}
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='m')document.getElementById('mapmodal').classList.toggle('show')});
draw();
</script></body></html>
