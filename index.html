<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/><title>Xbox Grand Open World</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060907;font-family:Arial,Helvetica,sans-serif;color:white;touch-action:none}button{font:inherit;color:inherit}.screen{position:absolute;inset:0}.hidden{display:none!important}
#boot{display:grid;place-items:center;background:linear-gradient(135deg,#050705,#0a130a)}#boot .xbox{width:min(32vw,180px);height:min(32vw,180px);border:16px solid #5cff28;border-bottom-color:transparent;border-left-color:transparent;border-radius:50%;transform:rotate(-45deg);filter:drop-shadow(0 0 28px #55ff20)}#boot h1{position:absolute;top:64%;letter-spacing:8px;font-size:22px}#boot.fade{animation:fade 1s forwards}@keyframes fade{to{opacity:0}}
#dashboard{background:linear-gradient(150deg,#202820,#090b09)}#topbar{height:68px;display:flex;align-items:center;justify-content:space-between;padding:12px 28px;background:#111511cc;border-bottom:1px solid #ffffff12}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:21px}.brandball{width:32px;height:32px;border:4px solid #fff;border-right-color:transparent;border-radius:50%;transform:rotate(-45deg)}.topactions{display:flex;gap:10px}.pill{border:0;background:#262d26;border-radius:18px;padding:9px 13px}.content{padding:24px 28px}.storehead{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.storehead h1{margin:0;font-size:32px}.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.game{height:min(56vh,440px);border:1px solid #ffffff20;border-radius:12px;overflow:hidden;background:#171c17;position:relative}.cover{height:72%;position:relative;overflow:hidden}.cover6{background:linear-gradient(155deg,#ff6a00 0 20%,#152b3b 21%,#0d6d78 58%,#eabf75)}.cover5{background:linear-gradient(145deg,#1a2334 0 45%,#9fc6df 46%,#4d6d49)}.coverbr{background:linear-gradient(145deg,#08180b 0 45%,#20b94d 46%,#f7cf4a)}.artcity{position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 8%,#fff2 9% 12%,transparent 13% 20%,#0007 21% 31%,transparent 32% 43%,#0008 44% 58%,transparent 59%),linear-gradient(0deg,#111 0 14%,transparent 15%)}.sun{position:absolute;width:90px;height:90px;border-radius:50%;background:#ffd568;right:10%;top:10%;box-shadow:0 0 60px #ffd568}.person{position:absolute;width:54px;height:120px;left:52%;bottom:12%;background:#e7e0d2;border-radius:28px 28px 8px 8px}.person:before{content:"";position:absolute;width:48px;height:48px;border-radius:50%;background:#9c6545;left:3px;top:-40px}.person:after{content:"";position:absolute;width:90px;height:24px;background:#181818;left:-18px;bottom:-8px}.gameinfo{height:28%;padding:12px 16px}.gametitle{font-weight:800;font-size:20px}.meta{color:#b8c1b8;font-size:12px;margin:5px 0}.download{float:right;border:0;border-radius:6px;background:#107c10;padding:8px 13px;font-weight:bold}.progress{height:5px;background:#303630;border-radius:4px;margin-top:8px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#70df31}.game.selected{outline:3px solid #71ed3d}
#game{background:#8dc9df}.hud{position:absolute;left:18px;top:18px;z-index:20}.money{font-size:20px;font-weight:800;text-shadow:2px 2px 2px #000}.wanted{color:#ffcf45;letter-spacing:3px}.missionhud{position:absolute;left:18px;top:80px;z-index:20;background:#111b;border-left:4px solid #ffbf25;padding:10px 12px;border-radius:4px;max-width:min(360px,65vw)}#canvas{width:100%;height:100%;display:block}#subtitle{position:absolute;bottom:128px;left:50%;transform:translateX(-50%);z-index:30;text-align:center;background:#000b;padding:8px 14px;border-radius:5px;max-width:75%;font-weight:bold}.controls{position:absolute;z-index:40;left:0;right:0;bottom:8px;height:190px;pointer-events:none}.stick,.abxy,.dpad,.trigger,.menuButton{pointer-events:auto;position:absolute;border:0;user-select:none}.stick{width:112px;height:112px;border-radius:50%;background:#111d;bottom:28px;border:3px solid #ffffff55}.stick:after{content:"";position:absolute;width:48px;height:48px;border-radius:50%;left:29px;top:29px;background:radial-gradient(circle at 35% 30%,#5c675f,#151915)}#ls{left:18px}#rs{left:145px;bottom:1px;width:88px;height:88px}.abxy{width:170px;height:170px;right:12px;bottom:10px}.abxy button{position:absolute;width:54px;height:54px;border-radius:50%;border:3px solid #ffffff66;font-weight:900;font-size:20px}.abxy button:active{filter:brightness(.7);transform:scale(.92)}#A{right:0;bottom:20px;background:#2fac42}#B{right:58px;top:0;background:#e33a43}#X{left:0;top:58px;background:#2490d5}#Y{right:58px;bottom:58px;background:#d9ad2d}.dpad{left:120px;bottom:8px;width:105px;height:105px}.dpad button{position:absolute;width:34px;height:34px;border:2px solid #ffffff44;background:#1b211b88}.dup{left:35px;top:0}.dleft{left:0;top:35px}.dright{right:0;top:35px}.ddown{left:35px;bottom:0}.trigger{top:-10px;width:74px;height:28px;border-radius:14px;background:#1c221c;border:2px solid #ffffff55;font-size:11px}.lt{left:30px}.lb{left:112px}.rt{right:30px}.rb{right:112px}.menuButton{width:42px;height:42px;border-radius:50%;background:#171d17;border:2px solid #ffffff55;bottom:62px}.view{left:calc(50% - 48px)}.menu{left:calc(50% + 6px)}.xbtn{position:absolute;width:48px;height:48px;border-radius:50%;left:calc(50% - 24px);bottom:4px;border:2px solid #86d85c;background:#1b301c;font-size:18px}
#cinematic{z-index:50;background:#111}.cinebar{position:absolute;left:0;right:0;height:13%;background:#050505}.cinebar.top{top:0}.cinebar.bottom{bottom:0}#cinematic canvas{width:100%;height:74%;top:13%;position:absolute}.cinecopy{position:absolute;z-index:55;bottom:16%;left:50%;transform:translateX(-50%);text-align:center}.cinecopy h2{margin:5px}.cinecopy button{border:0;border-radius:6px;background:#107c10;padding:10px 18px;font-weight:bold}
@media(max-width:700px){#topbar{padding:8px 12px}.content{padding:12px}.storehead h1{font-size:22px}.games{grid-template-columns:1fr 1fr 1fr;gap:7px}.game{height:56vh}.cover{height:64%}.gameinfo{padding:8px}.gametitle{font-size:13px}.meta{display:none}.download{padding:6px;font-size:11px}.person{transform:scale(.7);transform-origin:bottom}.stick{transform:scale(.75);transform-origin:bottom left}.abxy{transform:scale(.75);transform-origin:bottom right}.dpad{transform:scale(.75);transform-origin:bottom left}.lt,.lb,.rt,.rb{display:none}}
</style></head>
<body>
<div id="boot" class="screen"><div class="xbox"></div><h1>XBOX</h1></div>
<div id="dashboard" class="screen hidden"><header id="topbar"><div class="brand"><div class="brandball"></div>XBOX</div><div class="topactions"><button class="pill" id="lang">BR</button><button class="pill" id="settings">⚙</button></div></header><main class="content"><div class="storehead"><div><small>MICROSOFT STORE</small><h1>Jogos Grand City</h1></div><button class="pill" id="radio">♪ Rádio: CIDADE</button></div><section class="games" id="games"></section></main></div>
<div id="game" class="screen hidden"><canvas id="canvas"></canvas><div class="hud"><div class="money" id="money">$ 2.500</div><div class="wanted">★☆☆☆☆</div></div><div class="missionhud" id="missionhud">Visite o marcador dourado</div><div id="subtitle"></div><div class="controls"><button class="stick" id="ls" aria-label="Mover"></button><button class="stick" id="rs" aria-label="Câmera"></button><div class="dpad"><button class="dup">▲</button><button class="dleft">◀</button><button class="dright">▶</button><button class="ddown">▼</button></div><button class="trigger lt">LT</button><button class="trigger lb">LB</button><button class="trigger rt">RT</button><button class="trigger rb">RB</button><button class="menuButton view" id="view">◧</button><button class="menuButton menu" id="menu">☰</button><div class="abxy"><button id="A">A</button><button id="B">B</button><button id="X">X</button><button id="Y">Y</button></div><button class="xbtn" id="xbox">X</button></div></div>
<div id="cinematic" class="screen hidden"><div class="cinebar top"></div><canvas id="cinecanvas"></canvas><div class="cinebar bottom"></div><div class="cinecopy"><h2 id="cinetitle"></h2><button id="skipcine">INICIAR MISSÃO</button></div></div>
<script>
const $=s=>document.querySelector(s), gamesEl=$('#games');let lang='BR',installed=JSON.parse(localStorage.getItem('gcity-installed')||'[]'),downloading=false;const titles=[['GTA 6','Los Santos 209 GB','cover6'],['GTA 5','Los Santos 95 GB','cover5'],['GTA 5 BR','Brasil City 88 GB','coverbr']];
function renderStore(){gamesEl.innerHTML='';titles.forEach((g,i)=>{const is=installed.includes(i),el=document.createElement('article');el.className='game'+(is?' selected':'');el.innerHTML=`<div class="cover ${g[2]}"><div class="artcity"></div><div class="sun"></div><div class="person"></div></div><div class="gameinfo"><button class="download" data-i="${i}">${is?'JOGAR':'BAIXAR'}</button><div class="gametitle">${g[0]}</div><div class="meta">${g[1]} • Ação</div><div class="progress"><i></i></div></div>`;gamesEl.appendChild(el)})}renderStore();
setTimeout(()=>{$('#boot').classList.add('fade');setTimeout(()=>{$('#boot').classList.add('hidden');$('#dashboard').classList.remove('hidden')},900)},1500);
$('#lang').onclick=()=>{lang=lang==='BR'?'EN':'BR';$('#lang').textContent=lang;speak(lang==='BR'?'Idioma português selecionado':'English language selected')};
$('#settings').onclick=()=>speak(lang==='BR'?'Configurações: áudio e idioma':'Settings: audio and language');
function speak(text){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang==='BR'?'pt-BR':'en-US';u.rate=.9;speechSynthesis.speak(u)}
function engineBeep(freq=.08,dur=.08){try{const A=new (AudioContext||webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.type='sawtooth';o.frequency.value=55+freq*300;g.gain.setValueAtTime(.025,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+dur);o.connect(g).connect(A.destination);o.start();o.stop(A.currentTime+dur)}catch(e){}}
gamesEl.onclick=e=>{
 const b=e.target.closest('.download');
 if(!b)return;
 const i=+b.dataset.i;
 if(installed.includes(i)){startGame(i);return}
 if(downloading)return;
 downloading=true;
 let p=0;
 const bar=b.parentElement.querySelector('.progress i');
 b.textContent='BAIXANDO';
 const t=setInterval(()=>{
  p+=4+Math.random()*8;
  if(p>=100){
   clearInterval(t);p=100;
   installed.push(i);
   localStorage.setItem('gcity-installed',JSON.stringify(installed));
   b.textContent='JOGAR';bar.style.width='100%';downloading=false;renderStore();
  }else{bar.style.width=p+'%'}
 },160);
};
const cv=$('#canvas'),ctx=cv.getContext('2d');let W,H,px=500,py=500,angle=0,keys={},mission=false,missionStage=0,vehicle=false,cash=2500,currentGame=0,deliveryMode=false,npcs=[{x:650,y:520,s:'npc'}, {x:300,y:400,s:'npc'}, {x:760,y:300,s:'cop'}],mapX=0,mapY=0;
function resize(){W=cv.width=cv.clientWidth*devicePixelRatio;H=cv.height=cv.clientPixelRatio*devicePixelRatio}window.addEventListener('resize',resize);resize();
function startGame(i){currentGame=i;$('#dashboard').classList.add('hidden');$('#game').classList.remove('hidden');mission=false;missionStage=0;cash=2500;px=500;py=500;resize();speak(lang==='BR'?'Bem-vindo a Grand City. Vá até o marcador dourado.':'Welcome to Grand City. Go to the golden marker.')}
function worldToScreen(x,y){return [(x-px)*.9+W/2,(y-py)*.45+H/2]} 
function draw(){if($('#game').classList.contains('hidden'))return;resize();const speed=vehicle?6:2.8;if(keys.ArrowUp||keys.w)py-=speed;if(keys.ArrowDown||keys.s)py+=speed;if(keys.ArrowLeft||keys.a)px-=speed;if(keys.ArrowRight||keys.d)px+=speed;px=Math.max(80,Math.min(920,px));py=Math.max(80,Math.min(920,py));
ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.fillStyle='#65a77a';ctx.fillRect(0,0,W/devicePixelRatio,H/devicePixelRatio);
ctx.save();ctx.translate(W/devicePixelRatio/2-px*.9,H/devicePixelRatio/2-py*.45);ctx.scale(.9,.45);
ctx.fillStyle='#30383a';ctx.fillRect(120,120,800,800);ctx.fillStyle='#b9a87d';ctx.fillRect(450,120,160,800);ctx.fillRect(120,450,800,160);ctx.strokeStyle='#e7dbad';ctx.lineWidth=4;ctx.setLineDash([28,22]);ctx.beginPath();ctx.moveTo(530,120);ctx.lineTo(530,920);ctx.moveTo(120,530);ctx.lineTo(920,530);ctx.stroke();ctx.setLineDash([]);
// buildings
for(let x=180;x<440;x+=120)for(let y=180;y<420;y+=120){ctx.fillStyle='#d8bf8f';ctx.fillRect(x,y,90,90);ctx.fillStyle='#4f7185';ctx.fillRect(x+12,y+12,22,18);ctx.fillRect(x+52,y+12,22,18)}
for(let x=650;x<900;x+=100)for(let y=620;y<860;y+=100){ctx.fillStyle='#9caab0';ctx.fillRect(x,y,70,70)}
if(deliveryMode){ctx.fillStyle='rgba(82,255,177,.55)';ctx.beginPath();ctx.arc(820,820,22+Math.sin(Date.now()/160)*4,0,7);ctx.fill();ctx.fillStyle='#5cffb1';ctx.beginPath();ctx.moveTo(820,790);ctx.lineTo(840,820);ctx.lineTo(800,820);ctx.closePath();ctx.fill()}
// marker
const pulse=18+Math.sin(Date.now()/180)*5;ctx.fillStyle='rgba(255,202,45,.5)';ctx.beginPath();ctx.arc(530,350,pulse,0,7);ctx.fill();ctx.fillStyle='#ffd54a';ctx.beginPath();ctx.moveTo(530,320);ctx.lineTo(550,350);ctx.lineTo(510,350);ctx.closePath();ctx.fill();
// NPCs
npcs.forEach((n,i)=>{ctx.fillStyle=i===2?'#1e65ad':'#d4a14d';ctx.fillRect(n.x-10,n.y-28,20,28);ctx.fillStyle='#9c6545';ctx.beginPath();ctx.arc(n.x,n.y-34,9,0,7);ctx.fill()});
// player
ctx.fillStyle=vehicle?'#f13d42':'#141817';ctx.fillRect(px-18,py-35,36,35);ctx.fillStyle='#a86f50';ctx.beginPath();ctx.arc(px,py-43,12,0,7);ctx.fill();ctx.restore();
// distance and mission
if(!mission&&Math.hypot(px-530,py-350)<70){mission=true;missionStage=1;cinematic()}
if(deliveryMode&&Math.hypot(px-820,py-820)<65){deliveryMode=false;mission=false;missionStage=0;cash+=1500;$('#money').textContent='$ '+cash.toLocaleString();$('#missionhud').textContent=lang==='BR'?'MISSÃO CONCLUÍDA • +$1.500':'MISSION COMPLETE • +$1.500';engineBeep(.5,.4);speak(lang==='BR'?'Missão concluída. Você ganhou mil e cinco cento dólares.':'Mission complete. You earned one thousand five hundred dollars.')}
if(vehicle)engineBeep(.08,.05);requestAnimationFrame(draw)}requestAnimationFrame(draw);
function cinematic(){const c=$('#cinematic');c.classList.remove('hidden');const cc=$('#cinecanvas'),x=cc.getContext('2d');cc.width=cc.clientWidth*devicePixelRatio;cc.height=cc.clientHeight*devicePixelRatio;let t=0;const title=lang==='BR'?'ENTREGA DUVIDOSA':'DOUBTFUL DELIVERY';$('#cinetitle').textContent=title;const text=lang==='BR'?'Marco: Preciso que leve este pacote para o outro lado da cidade.':'Marco: Take this package across town.';$('#subtitle').textContent=text;speak(text);function cf(){if(c.classList.contains('hidden'))return;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);let w=cc.clientWidth,h=cc.clientHeight;t++;let grad=x.createLinearGradient(0,0,w,h);grad.addColorStop(0,'#d29a66');grad.addColorStop(1,'#31526a');x.fillStyle=grad;x.fillRect(0,0,w,h);x.fillStyle='#20282b';for(let i=0;i<9;i++)x.fillRect(i*w/9,h*.45,w/11,h*.55);x.fillStyle='#6a3d29';x.beginPath();x.arc(w*.38,h*.62,28+Math.sin(t/20)*2,0,7);x.fill();x.fillStyle='#c29a73';x.beginPath();x.arc(w*.62,h*.58,28+Math.sin(t/20)*2,0,7);x.fill();x.strokeStyle='#e9c198';x.lineWidth=8;x.beginPath();x.moveTo(w*.38,h*.72);x.lineTo(w*.38+t%20,h*.58);x.moveTo(w*.62,h*.68);x.lineTo(w*.62-t%20,h*.54);x.stroke();requestAnimationFrame(cf)}cf()}
$('#skipcine').onclick=()=>{$('#cinematic').classList.add('hidden');$('#subtitle').textContent='';$('#missionhud').textContent=lang==='BR'?'Missão: leve o pacote ao porto':'Mission: deliver the package to the docks';px=530;py=360;deliveryMode=true};
function openMenu(){const txt=lang==='BR'?'Menu: Mapa • Rádio • Idioma BR':'Menu: Map • Radio • Language EN';$('#subtitle').textContent=txt;speak(txt);setTimeout(()=>{if(!$('#cinematic').classList.contains('hidden')){}else $('#subtitle').textContent=''},2200)}
let radioIndex=0;
const radioNames=lang==='BR'?['CIDADE','FUNK','PAGODE','SERTANEJO']:['CITY','HIP-HOP','ROCK','POP'];
function playRadio(){radioIndex=(radioIndex+1)%radioNames.length;$('#radio').textContent='♪ Rádio: '+radioNames[radioIndex];speak(lang==='BR'?`Rádio ${radioNames[radioIndex]} ligado`:`Radio ${radioNames[radioIndex]} on`) }
$('#radio').onclick=playRadio;
$('#menu').onclick=openMenu;$('#view').onclick=()=>{speak(lang==='BR'?'Mapa da cidade aberto':'City map open')};$('#xbox').onclick=()=>{$('#game').classList.add('hidden');$('#dashboard').classList.remove('hidden')};
$('#A').onpointerdown=e=>{e.prevent;vehicle=!vehicle;openMenu()};
$('#B').onpointerdown=()=>{speak(lang==='BR'?'Ação cancelada':'Action cancelled')};$('#X').onpointerdown=()=>{engineBeep(.2,.15);speak(lang==='BR'?'Atirando':'Shooting')};$('#Y').onpointerdown=()=>{missionStage++;if(missionStage>1){mission=false;cash+=1500;$('#money').textContent='$ '+cash.toLocaleString();$('#missionhud').textContent=lang==='BR'?'Missão concluída • $1.500':'Mission complete • $1.500';speak(lang==='BR'?'Missão concluída':'Mission complete')}};
['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].forEach(k=>{});window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='Escape')openMenu()});window.addEventListener('keyup',e=>{keys[e.key]=false});
const ls=$('#ls');
ls.addEventListener('pointerdown',e=>{ls.setPointerCapture(e.pointerId)});
ls.addEventListener('pointermove',e=>{if(!ls.hasPointerCapture(e.pointerId))return;const r=ls.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);keys.ArrowLeft=x<-18;keys.ArrowRight=x>18;keys.ArrowUp=y<-18;keys.ArrowDown=y>18});
ls.addEventListener('pointerup',()=>{keys.ArrowLeft=keys.ArrowRight=keys.ArrowUp=keys.ArrowDown=false});
</script>
</body></html>
